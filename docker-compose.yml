# Starts the whole backend with one command:  docker compose up -d --build
# Four containers ("services") that can talk to each other by name.

services:
  # The database. Uses the official PostgreSQL image, so there's nothing to build.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      # Read from the .env file. Compose refuses to start if it's missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
    volumes:
      # Keeps the data when the container is deleted or updated.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # "Is the database ready to accept connections yet?"
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U calendar -d calendar"]  # over the network, like the API connects
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: the database is only reachable from inside Docker,
    # never from your network or the internet.

  # Our Express API. Built from the Dockerfile in ./api
  api:
    build:
      # Build from the project root (not ./api) so the image can also include shared/
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      # "db" is the service name above; Docker turns it into the database's address.
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD}@db:5432/calendar
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SITE_URL: ${SITE_URL:-https://slotted.taraskoval.ca}
      # Optional: email for "Forgot your password?" (see README.md)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Where "Report a problem" messages are emailed (uses the same Resend setup)
      REPORT_EMAIL: ${REPORT_EMAIL:-ktaras105@gmail.com}
      # Optional: "Continue with Google" (see README.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      # Only reachable from the server itself (for curl tests). Everyone else
      # comes in through the Cloudflare tunnel below, never straight to port 3000.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy   # wait until the database is actually ready

  # The Cloudflare Tunnel: an outgoing, encrypted connection to Cloudflare.
  # Visitors to https://api.taraskoval.ca reach the API through it, so no router
  # ports are opened and your home IP address stays hidden.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the .env file}
    depends_on:
      - api

  # Nightly database backups into /srv/backups/western-calendar on the server.
  # Uses the same PostgreSQL image, which includes the pg_dump tool.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: calendar
      PGDATABASE: calendar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: 14
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_DIR:-/srv/backups/western-calendar}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
